# Netlify hostet die Jarvis-Oberfläche. Der Kern (Claude Code) läuft auf deinem Computer.
[build]
  publish = "public"
  # Cloud-Persona aus persona.md erzeugen (einzige Persona-Quelle für Lokal und Cloud)
  command = "node scripts/build-persona.mjs"

[build.environment]
  NODE_VERSION = "22"

[[edge_functions]]
  path = "/api/cloud"
  function = "cloud"

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "microphone=(self)"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"

# Sicherer Kunden-Zugang (TF-041): strikte CSP (nur eigene Skripte, nur eigene API), nie cachen, nie indexieren.
[[headers]]
  for = "/access*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'"
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000"

# TF-063: Login und Verkäufer-Oberfläche – nur eigene Skripte/Styles/API, nie cachen, nie indexieren.
[[headers]]
  for = "/login*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'"
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000"
[[headers]]
  for = "/sales*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'"
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000"
