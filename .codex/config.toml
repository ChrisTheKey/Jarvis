# Codex CLI – Projektprofil Jarvis (greift im vertrauten Projektordner / Worktree)
# Voller Lese-/Schreibzugriff auf den Worktree, kein Netzwerk, kein Zugriff ausserhalb.
sandbox_mode = "workspace-write"
approval_policy = "on-request"

[sandbox_workspace_write]
network_access = false
# Ein Worktree-Commit schreibt ins Git-Verzeichnis des Hauptrepos (ausserhalb des Worktrees). Nur das Nötige freigeben:
# Objekte, den eigenen Worktree-Index sowie Referenzen/Logs des Branch-Namensraums agent-codex/* (exklusiv für Codex; Claude nutzt agent-claude/*). Pfade gelten für diese Maschine
# (Neuaufbau: scripts/setup-dev-worktrees.ps1).
writable_roots = [
  'C:\Users\Administrator\Documents\Chris\Jarvis\.git\objects',
  'C:\Users\Administrator\Documents\Chris\Jarvis\.git\worktrees\Jarvis-codex',
  'C:\Users\Administrator\Documents\Chris\Jarvis\.git\refs\heads\agent-codex',
  'C:\Users\Administrator\Documents\Chris\Jarvis\.git\logs\refs\heads\agent-codex',
]
