      - paragraph [ref=e100]: Als Fachärztin für Psychiatrie und Psychotherapie biete ich Ihnen eine evidenzbasierte, leitliniengerechte Behandlung – verbunden mit einer wertschätzenden therapeutischen Beziehung.
