  - generic [ref=e141]:
    - img "Serene misty forest lake at dawn symbolizing mental healing tranquility and inner peace" [ref=e145]
    - generic [ref=e146]:
      - generic [ref=e147]: med. pract. Andrea Kälin
      - generic [ref=e148]: Fachärztin für Psychiatrie und Psychotherapie FMH
      - heading "Indikationsspektrum meiner fachärztlichen Tätigkeit" [level=2] [ref=e149]
      - paragraph [ref=e150]: Als Fachärztin für Psychiatrie und Psychotherapie biete ich eine evidenzbasierte Diagnostik und individuell abgestimmte Behandlung psychischer Erkrankungen. In einem vertraulichen, professionellen Rahmen begleite ich meine Patientinnen und Patienten mit dem Ziel einer nachhaltigen Stabilisierung und Verbesserung der Lebensqualität.
      - list [ref=e151]:
        - listitem [ref=e152]:
          - generic [ref=e156]:
            - heading "Affektive Störungen" [level=4] [ref=e157]
            - paragraph [ref=e158]: Differenzierte Diagnostik und leitliniengerechte Behandlung depressiver Episoden, rezidivierender und bipolarer affektiver Störungen.
        - listitem [ref=e159]:
          - generic [ref=e163]:
            - heading "Angst- und Panikstörungen" [level=4] [ref=e164]
            - paragraph [ref=e165]: Psychotherapeutische und gegebenenfalls pharmakologische Behandlung von generalisierten Angststörungen, Panikstörungen, sozialen Phobien sowie spezifischen Phobien.
        - listitem [ref=e166]:
          - generic [ref=e170]:
            - heading "Belastungs- und Anpassungsstörungen" [level=4] [ref=e171]
            - paragraph [ref=e172]: Fachärztliche Begleitung bei Burnout-Syndromen, akuten Belastungsreaktionen sowie bei beruflichen und biografischen Krisensituationen.
        - listitem [ref=e173]:
          - generic [ref=e177]:
            - heading "Zwangs- und Traumafolgestörungen" [level=4] [ref=e178]
            - paragraph [ref=e179]: Spezialisierte Therapieverfahren bei Zwangsstörungen, posttraumatischer Belastungsstörung (PTBS) sowie komplexen Traumafolgestörungen.
  - generic [ref=e181]:
    - generic [ref=e182]:
      - generic [ref=e183]: Diagnostik & Behandlung
      - heading "Evidenzbasierte psychiatrische Behandlung" [level=2] [ref=e184]
      - paragraph [ref=e185]: Als Fachärztin für Psychiatrie und Psychotherapie biete ich eine fundierte, leitliniengerechte Diagnostik und Behandlung psychischer Erkrankungen – stets unter Berücksichtigung der individuellen Lebenssituation meiner Patientinnen und Patienten.
    - generic [ref=e186]:
      - generic [ref=e192]:
        - heading "Psychiatrische Diagnostik" [level=3] [ref=e193]
        - paragraph [ref=e194]: Eine sorgfältige differentialdiagnostische Abklärung bildet die Grundlage jeder Behandlung. Anhand standardisierter Verfahren nach ICD-11 erstelle ich eine fundierte Diagnose als Basis für Ihren individuellen Therapieplan.
      - generic [ref=e200]:
        - heading "Pharmakotherapie" [level=3] [ref=e201]
        - paragraph [ref=e202]: Eine leitliniengerechte medikamentöse Therapie bei Depressionen, Angststörungen, bipolaren Erkrankungen und weiteren Indikationen – mit engmaschiger Verlaufskontrolle und transparenter Aufklärung über Wirkung und Nebenwirkungen.
      - generic [ref=e213]:
        - heading "Kognitive Verhaltenstherapie" [level=3] [ref=e214]
        - paragraph [ref=e215]: Ein wissenschaftlich anerkanntes Psychotherapieverfahren zur Behandlung von Depressionen, Angst- und Zwangsstörungen. Gemeinsam identifizieren wir dysfunktionale Denkmuster und entwickeln konkrete Bewältigungsstrategien.
      - generic [ref=e221]:
        - heading "Krisenintervention" [level=3] [ref=e222]
        - paragraph [ref=e223]: In akuten psychischen Belastungssituationen biete ich eine zeitnahe, professionelle Unterstützung. Ziel ist die rasche Stabilisierung sowie die Erarbeitung tragfähiger Perspektiven für die weitere Behandlung.
  - generic [ref=e225]:
    - generic [ref=e226]:
      - generic [ref=e227]: Zur Person
      - heading "Dr. med. Andrea Kälin" [level=2] [ref=e228]
      - paragraph [ref=e229]: Fachärztin für Psychiatrie und Psychotherapie FMH
    - generic [ref=e230]:
      - paragraph [ref=e231]: Als Fachärztin für Psychiatrie und Psychotherapie führe ich meine Praxis nach höchsten medizinischen und ethischen Standards. Eine fundierte Diagnostik, eine evidenzbasierte Behandlung sowie ein vertrauensvolles therapeutisches Bündnis bilden die Grundpfeiler meiner Tätigkeit.
      - paragraph [ref=e232]: Nach dem Medizinstudium und der mehrjährigen Facharztausbildung an renommierten psychiatrischen Kliniken habe ich meine Expertise in verschiedenen therapeutischen Verfahren – insbesondere in der kognitiven Verhaltenstherapie, der tiefenpsychologisch fundierten Psychotherapie sowie in der Psychopharmakologie – kontinuierlich vertieft. Regelmässige Fort- und Weiterbildungen sowie Supervisionen sichern die Qualität meiner Arbeit nach den aktuellen wissenschaftlichen Erkenntnissen.
      - paragraph [ref=e233]: Mein integrativer Behandlungsansatz verbindet medizinisch-psychiatrische Fachkompetenz mit einer empathischen, an Ihrer individuellen Lebenssituation orientierten Therapieführung. Selbstverständlich unterliegt jede Behandlung der ärztlichen Schweigepflicht.
      - generic [ref=e234]:
        - heading "Meine fachlichen Grundsätze:" [level=4] [ref=e235]
        - list [ref=e236]:
          - listitem [ref=e237]: Evidenzbasierte Diagnostik und leitliniengerechte Behandlung
          - listitem [ref=e240]: Strikte Wahrung der ärztlichen Schweigepflicht und Diskretion
          - listitem [ref=e243]: Individuelle Therapieplanung mit transparenter Aufklärung
          - listitem [ref=e246]: Interdisziplinäre Zusammenarbeit mit Hausärzten und Fachkollegen
