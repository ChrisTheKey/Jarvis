<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JARVIS 2.0</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%2364e6ff' stroke-width='2'/><circle cx='16' cy='16' r='5' fill='%2364e6ff'/></svg>" />
</head>
<body>
  <div class="grid-backdrop" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="reactor-mini" aria-hidden="true"></span>
      <div>
        <h1>JARVIS<span>2.0</span></h1>
        <p class="tagline">Just A Rather Very Intelligent System</p>
      </div>
    </div>
    <div class="status-strip" id="statusStrip" role="status" aria-live="polite"></div>
  </header>

  <main class="layout">
    <!-- Conversation -->
    <section class="panel conversation" aria-label="Conversation">
      <div class="panel-head">
        <h2>Conversation</h2>
        <div class="head-actions">
          <label class="toggle">
            <input type="checkbox" id="voiceReplies" checked />
            <span>Speak replies</span>
          </label>
          <button class="ghost" id="resetBtn" type="button">Clear</button>
        </div>
      </div>

      <div class="transcript" id="transcript" aria-live="polite"></div>

      <div class="composer">
        <button class="mic" id="micBtn" type="button" aria-label="Hold to speak">
          <span class="reactor" aria-hidden="true"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M18 11a6 6 0 0 1-12 0M12 17v4"/></svg>
        </button>
        <form id="composerForm" class="composer-form">
          <input id="messageInput" type="text" autocomplete="off" placeholder="Ask JARVIS to handle something…" />
          <button type="submit" id="sendBtn">Send</button>
        </form>
      </div>
      <p class="hint" id="hint">Try: “Schedule a design review with Pepper tomorrow at 3pm and email her the agenda.”</p>
    </section>

    <aside class="sidebar">
    <!-- Agent activity -->
    <section class="panel activity" aria-label="Agent activity">
      <div class="panel-head">
        <h2>Agent Army</h2>
        <span class="counter" id="activityCount">idle</span>
      </div>
      <ul class="agent-roster" id="agentRoster"></ul>
      <div class="feed" id="activityFeed"></div>
    </section>

    <!-- Dashboard panels -->
    <section class="panel stats" aria-label="At a glance">
      <div class="stat" data-stat="events"><span class="stat-value">0</span><span class="stat-label">Upcoming</span></div>
      <div class="stat" data-stat="emails"><span class="stat-value">0</span><span class="stat-label">Outbox</span></div>
      <div class="stat" data-stat="expenses"><span class="stat-value">$0</span><span class="stat-label">Logged</span></div>
      <div class="stat" data-stat="contacts"><span class="stat-value">0</span><span class="stat-label">Contacts</span></div>
    </section>

    <section class="panel records" aria-label="Records">
      <div class="panel-head">
        <h2>Records</h2>
        <div class="tabs" id="tabs" role="tablist">
          <button role="tab" class="active" data-tab="events">Calendar</button>
          <button role="tab" data-tab="emails">Outbox</button>
          <button role="tab" data-tab="expenses">Expenses</button>
          <button role="tab" data-tab="contacts">Contacts</button>
          <button role="tab" data-tab="notes">Notes</button>
        </div>
      </div>
      <div class="records-body" id="recordsBody"></div>
    </section>
    </aside>
  </main>

  <audio id="player" hidden></audio>
  <script src="/app.js" type="module"></script>
</body>
</html>
