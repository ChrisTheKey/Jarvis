# Jarvis Calling Agent (TF-065) – EIGENES Compose-Projekt «jarvis-calling» unter /opt/jarvis-calling, getrennt von «jarvis-mail», «jarvis-repair»,
# «jarvis-crm», «jarvis-contacts» und «jarvis-vn». Genau ein Service, keine depends_on, eigenes Image, kein Docker-Socket, keine fremden Daten,
# keine offenen Ports (der Dienst verbindet sich nur ausgehend). Deploy nur über deploy/vps/deploy-calling.sh.
# Daten: /opt/jarvis-calling/data (calling_state.json, calling_health.json – 600, keine Audiodaten). Einziger Schreiber: dieser Dienst.
name: jarvis-calling
services:
  calling:
    container_name: jarvis-calling
    build:
      context: ./app
      dockerfile: deploy/vps/Dockerfile.calling
      args:
        JARVIS_COMMIT: ${JARVIS_COMMIT:-unknown}
    image: jarvis-calling:latest
    restart: unless-stopped
    # JARVIS_CALLING_AGENT_TOKEN/URL (abgeleitet) + optional LIVEKIT_URL, LIVEKIT_API_KEY, LIVEKIT_API_SECRET, LIVEKIT_SIP_TRUNK_CH/VN,
    # LIVEKIT_CALLER_ID_CH/VN, JARVIS_TRANSFER_CH/VN_NUMBER, CALLING_DRY_RUN, CALLING_DEFAULT/MAX_CONCURRENCY. Datei 600, nie im Git.
    env_file: ./.env
    volumes:
      - /opt/jarvis-calling/data:/data/calling
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m
    cpus: 1.5
    healthcheck:
      test: ["CMD", "node", "calling/service.js", "--healthcheck"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
