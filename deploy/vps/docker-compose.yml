# Jarvis Always-on Mail-Worker auf dem Hetzner-VPS – eigenes Compose-Projekt unter /opt/jarvis-mail,
# unabhängig von anderen Diensten auf dem Server.
#   cd /opt/jarvis-mail && sudo docker compose up -d --build
# Reparaturaufträge (CHF 480/150) laufen seit TF-047 im separaten Projekt jarvis-repair (deploy/vps/deploy-repair.sh) – ein
# Repair-Deploy berührt diesen Container nie. Achtung: dieser Mail-Deploy (deploy.sh) recreated den Mail-Worker = geplante Wartung.
# Startet automatisch nach VPS-Neustart (Docker-Dienst), Container-Neustart und Prozessabsturz (restart: unless-stopped).
name: jarvis-mail
services:
  mail-worker:
    build:
      context: ./app
      dockerfile: deploy/vps/Dockerfile
      # Von deploy.sh gesetzt (Commit + Zeitpunkt) – nur für die Anzeige LAST DEPLOY, keine Secrets.
      args:
        JARVIS_COMMIT: ${JARVIS_COMMIT:-unknown}
        JARVIS_DEPLOYED_AT: ${JARVIS_DEPLOYED_AT:-}
    image: jarvis-mail-worker:latest
    restart: unless-stopped
    # Nur: JARVIS_MAIL_WORKER_TOKEN, ANTHROPIC_API_KEY, JARVIS_SERVER_CONTROL_TOKEN (Server Control), optional JARVIS_SYNC_URL / JARVIS_MAIL_MODEL. Datei mit Rechten 600.
    # TF-080: E2E-Testlauf-Freigabe (JARVIS_E2E_TEST_*, keine Secrets) – nie Stripe-Schlüssel im Mail-Worker.
    env_file:
      - ./.env
      - /opt/jarvis-payment/e2e.env
    volumes:
      # Gmail-Credentials, Token, Register, Leads, Suppression, Worker-Zustand – nur hier, Verzeichnis 700, Dateien 600.
      - ./secrets:/data/secrets
      # TF-047: separater Repair-Service (/opt/jarvis-repair, eigenes Projekt). Outbox: Service-Mails, die NUR dieser Worker
      # (Sender Authority) genau einmal sendet. Repair-Zustand nur lesend (Dashboard, Kunden-Dedupe).
      - /opt/jarvis-repair/outbox:/data/repair-outbox
      - /opt/jarvis-repair/state/mail_worker:/data/repair-state:ro
      # TF-053: Lead-CRM (Dienst jarvis-crm ist einziger Schreiber) – hier NUR lesend: „Do Not Contact“ sperrt neue Cold-Entwürfe.
      - /opt/jarvis-mail/data:/data/crm:ro
    environment:
      JARVIS_REPAIR_OUTBOX: /data/repair-outbox
      JARVIS_REPAIR_STATE_DIR: /data/repair-state
      JARVIS_CRM_DIR: /data/crm
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "mail-worker.js", "--healthcheck"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
