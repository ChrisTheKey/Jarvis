# Jarvis Lead-CRM (TF-053) – EIGENES Compose-Projekt «jarvis-crm» unter /opt/jarvis-crm, getrennt von «jarvis-mail» und
# «jarvis-contacts». Ein Build/Start hier kann den Mail-Worker (jarvis-mail-mail-worker-1) nicht erfassen: anderes Projekt,
# genau ein Service, keine depends_on, eigenes Image, kein Docker-Socket.
#   Deploy nur über deploy/vps/deploy-crm.sh (prüft Mail-Worker und Kontaktdienst vorher/nachher).
# Daten: /opt/jarvis-mail/data/lead_crm.json (einziger Schreiber: dieser Dienst), crm_audit.jsonl, crm_backups/ (verschlüsselt), alle 600.
name: jarvis-crm
services:
  crm-worker:
    container_name: jarvis-crm-worker
    build:
      context: ./app
      dockerfile: deploy/vps/Dockerfile.crm
      args:
        JARVIS_COMMIT: ${JARVIS_COMMIT:-unknown}
    image: jarvis-crm-worker:latest
    restart: unless-stopped
    # Nur JARVIS_CRM_AGENT_TOKEN (abgeleitet, gilt allein für /api/crm) und JARVIS_CRM_URL. Datei 600, von crm-remote.sh erzeugt.
    env_file: ./.env
    volumes:
      # CRM-Zustand + Kontaktverzeichnis (nur gelesen) – der Kontaktdienst schreibt hier sein Verzeichnis, dieser Dienst nur lead_crm.json.
      - /opt/jarvis-mail/data:/data/crm
      # NUR LESEND: Lead-Datenbank, Cold-Register, Gmail-Register. Der Code öffnet ausschliesslich diese drei Dateien.
      - /opt/jarvis-mail/secrets:/data/mail:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "node", "crm-service.js", "--healthcheck"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
